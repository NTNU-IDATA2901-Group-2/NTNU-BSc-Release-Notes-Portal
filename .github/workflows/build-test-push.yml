name: CI Frontend & Backend
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm eslint

      - name: Build project
        run: pnpm build
      
      - name: Upload static content artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-static-content
          path: frontend/dist/

  compile-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download static content artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-static-content
          path: src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Build with Maven
        run: mvn clean package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run spring-boot application
        run: java -jar target/*.jar --spring.profiles.active=ci &

      - name: Wait for spring-boot
        run: |
          for i in {1..60}
          do
            if curl -s http://localhost:8080/actuator/health | grep '"status":"UP"'; then
              echo "Spring boot has started"
              break
            fi
            echo "Waiting for spring boot..."
            sleep 1s
          done

      - name: Run Bruno API Tests
        run: bru run --env Local
        working-directory: test/ReleaseNoteAPITests

      - name: Upload spring-boot artifact
        uses: actions/upload-artifact@v6
        with:
          name: spring-boot-artifact
          path: target/*.jar
  docker-build-push:
    if: |
      ${{github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'}}
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download spring-boot artifact
        uses: actions/download-artifact@v7
        with:
          name: spring-boot-artifact
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/ntnu-idata2901-group-2/ntnu-bsc-release-notes-portal:latest

