services:
  caddy:
    image: caddy:2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - keycloak # remove if using an external OIDC provider

  app:
    image: ghcr.io/ntnu-idata2901-group-2/ntnu-bsc-release-notes-portal:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_started
    expose:
      - "8080"
    environment:
      - CORS_ALLOWED_ORIGINS=
      # OIDC provider (any spec-compliant IdP; see README "Identity Provider Configuration")
      - OIDC_ISSUER_URI=
      - OIDC_CLIENT_ID=
      - OIDC_SCOPES=openid profile
      - OIDC_AUDIENCE=
      - DB_USERNAME=
      - DB_PASSWORD=
      - DB_DATABASE=
      - DB_URL=
      - OPENAI_URL=
      - OPENAI_API_KEY=
      - OPENAI_CHAT_COMPLETIONS_PATH=
      - OPENAI_MODEL=
      - JIRA_BASE_URL=
      - JIRA_EMAIL=
      - JIRA_API_TOKEN=
      - RELEASE_NOTE_DIRECTORY=

  # Example IdP — remove this service (and the Caddy auth host) when using an
  # external OIDC provider such as Entra ID
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
      KC_HOSTNAME: https://auth.app.local
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start"]
    expose:
      - "8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  db:
    image: postgres:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
  keycloak_data: # remove if using an external OIDC provider
  caddy_data:
  caddy_config:
