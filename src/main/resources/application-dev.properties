spring.config.import=file:.env[.properties]
spring.application.name=Release Notes Portal (DEV)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

logging.level.org.hibernate=info

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql,classpath:data-dev.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/${KC_REALM}