spring.application.name=Release Notes Portal

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=warn
logging.level.no.reliablesolutions=info
logging.level.org.hibernate=error

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:}
app.auth.claims.roles-claim=${OIDC_ROLES_CLAIM:roles}
app.auth.claims.customer-claim=${OIDC_CUSTOMER_CLAIM:groups}
app.auth.claims.customer-prefix=${OIDC_CUSTOMER_PREFIX:/Customers/}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_URL}
spring.ai.openai.chat.completions-path=${OPENAI_CHAT_COMPLETIONS_PATH}
spring.ai.openai.chat.options.model=${OPENAI_MODEL}