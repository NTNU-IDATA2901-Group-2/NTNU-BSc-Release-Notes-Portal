spring.application.name=Release Notes Portal

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=warn
logging.level.org.springframework.web=debug
logging.level.org.hibernate=error

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_ISSUER_URL}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KC_JWK_SET_URI}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_URL}
spring.ai.openai.chat.options.model=${OPENAI_MODEL}